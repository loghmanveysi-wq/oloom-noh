workflows:
  android-apk:
    name: Oloom Noh APK
    max_build_duration: 40
    instance_type: mac_mini_m2
    environment:
      flutter: 3.19.6
      java: 17
      vars:
        SYNCFUSION_KEY: ""
    scripts:
      - name: ساخت پوشه‌ی android
        script: |
          flutter create --platforms=android --org com.veisi --project-name oloom_noh .
      - name: آماده‌سازی android (Firebase، مجوزها)
        script: |
          python3 tools/prepare_android.py
      - name: نصب پکیج‌ها
        script: |
          flutter pub get
      - name: ساخت APK
        script: |
          flutter build apk --release --split-per-abi --dart-define=SYNCFUSION_KEY=$SYNCFUSION_KEY
    artifacts:
      - build/**/outputs/**/*.apk
