name: oloom_noh
description: "علوم نهم – استاد ویسی: اپلیکیشن آموزشی علوم تجربی پایه نهم"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Firebase (بدون Storage؛ آپلود فایل‌ها با Cloudinary است)
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.4
  cloud_firestore: ^4.15.4

  # State و ذخیره‌ی محلی
  provider: ^6.1.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # PDF
  syncfusion_flutter_pdfviewer: ^24.2.8
   syncfusion_flutter_core: ^24.2.8

  # عکس
  image_picker: ^1.0.7
  image_cropper: ^5.0.1
  cached_network_image: ^3.3.1

  # نمودار، شبکه و لینک
  fl_chart: ^0.66.2
  http: ^1.2.1
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
