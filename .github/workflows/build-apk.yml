name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: stable
          cache: true

      - name: ساخت پوشه‌ی android
        run: flutter create --platforms=android --org com.veisi --project-name oloom_noh .

      - name: آماده‌سازی android
        run: python3 tools/prepare_android.py

      - name: نصب پکیج‌ها
        run: flutter pub get

      - name: ساخت APK
        env:
          SYNCFUSION_KEY: ${{ secrets.SYNCFUSION_KEY }}
        run: |
          if [ -n "$SYNCFUSION_KEY" ]; then
            flutter build apk --release --split-per-abi --dart-define=SYNCFUSION_KEY=$SYNCFUSION_KEY
          else
            flutter build apk --release --split-per-abi
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: oloom-noh-apk
          path: build/app/outputs/flutter-apk/*.apk
