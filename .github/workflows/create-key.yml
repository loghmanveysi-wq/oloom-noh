name: Create signing key (one time)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: ساخت کلید امضا (keystore)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: Secret با نام KEYSTORE_PASSWORD تنظیم نشده است."
            exit 1
          fi
          if [ -f android-signing/oloom-release.jks ]; then
            echo "ERROR: کلید از قبل وجود دارد. برای جلوگیری از گم شدن امضا، چیزی تغییر نکرد."
            exit 1
          fi
          mkdir -p android-signing
          keytool -genkeypair -v \
            -keystore android-signing/oloom-release.jks \
            -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias oloom \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Loghman Veisi, OU=Oloom Noh, O=Oloom Noh, L=Ravansar, ST=Kermanshah, C=IR"

      - name: ذخیره‌ی کلید (رمزدار) در ریپازیتوری
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add android-signing/oloom-release.jks
          git commit -m "Add release keystore (password protected)"
          git push

      - name: نسخه‌ی پشتیبان کلید (همین الان دانلود و نگه‌داری کنید)
        uses: actions/upload-artifact@v4
        with:
          name: oloom-release-keystore-BACKUP
          path: android-signing/oloom-release.jks
